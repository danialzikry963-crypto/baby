<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sayang Space - Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f5f7;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 15px;
    }

    .notify-btn {
      display: block;
      margin: 0 auto 25px;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      background: #222;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .notify-btn:active {
      transform: scale(0.97);
    }

    .section {
      margin-top: 25px;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .card-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .time {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    .empty {
      color: #999;
      font-size: 14px;
      padding: 10px 0;
    }

    .message {
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💗 Sayang Space</h1>

  <div class="subtitle">
    Dashboard
  </div>

  <button
    class="notify-btn"
    onclick="enableNotifications()"
  >
    🔔 Enable Notifications
  </button>


  <!-- ========================= -->
  <!-- MAKANAN -->
  <!-- ========================= -->

  <div class="section">

    <div class="section-title">
      🍔 Makanan
    </div>

    <div id="foodList">
      <div class="empty">
        Belum ada pilihan makanan.
      </div>
    </div>

  </div>


  <!-- ========================= -->
  <!-- EMOTION -->
  <!-- ========================= -->

  <div class="section">

    <div class="section-title">
      💭 Emotion
    </div>

    <div id="emotionList">
      <div class="empty">
        Belum ada emotion.
      </div>
    </div>

  </div>


  <!-- ========================= -->
  <!-- LUAHAN -->
  <!-- ========================= -->

  <div class="section">

    <div class="section-title">
      💌 Luahan
    </div>

    <div id="feelingList">
      <div class="empty">
        Belum ada luahan.
      </div>
    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


  import {
    getDatabase,
    ref,
    onValue,
    onChildAdded
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


  /* ========================= */
  /* FIREBASE */
  /* ========================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyDSFvZ3JtqTB7HP85WyRa5dka9VRUJdKDU",

    authDomain:
      "baby-7eec4.firebaseapp.com",

    databaseURL:
      "https://baby-7eec4-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
      "baby-7eec4",

    storageBucket:
      "baby-7eec4.firebasestorage.app",

    messagingSenderId:
      "824621868036",

    appId:
      "1:824621868036:web:870a7c66e9311fb77ec151"
  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getDatabase(app);


  /* ========================= */
  /* SERVICE WORKER */
  /* ========================= */

  let dashboardRegistration = null;

  async function setupServiceWorker() {

    if (!("serviceWorker" in navigator)) {
      console.log(
        "Service Worker tidak disokong."
      );
      return;
    }

    try {

      dashboardRegistration =
        await navigator.serviceWorker.register(
          "./firebase-messaging-sw.js"
        );

      console.log(
        "✅ Firebase Messaging Service Worker ready"
      );

    } catch (error) {

      console.error(
        "❌ Service Worker error:",
        error
      );

    }

  }


  setupServiceWorker();


  /* ========================= */
  /* NOTIFICATION PERMISSION */
  /* ========================= */

  window.enableNotifications =
    async function() {

      if (!("Notification" in window)) {

        alert(
          "Browser/device ini tidak support notification."
        );

        return;
      }


      const permission =
        await Notification.requestPermission();


      if (permission === "granted") {

        alert(
          "🔔 Notification dah aktif!"
        );

        console.log(
          "✅ Notification permission granted"
        );

      } else {

        alert(
          "Notification belum dibenarkan."
        );

      }

    };


  /* ========================= */
  /* SHOW NOTIFICATION */
  /* ========================= */

  async function showDashboardNotification(
    title,
    body
  ) {

    if (
      !("Notification" in window) ||
      Notification.permission !== "granted"
    ) {

      console.log(
        "Notification belum dibenarkan."
      );

      return;
    }


    try {

      if (!dashboardRegistration) {

        dashboardRegistration =
          await navigator.serviceWorker.ready;

      }


      await dashboardRegistration.showNotification(
        title,
        {
          body: body,

          icon:
            "./icon-192.png",

          badge:
            "./icon-192.png"
        }
      );


      console.log(
        "🔔 Notification sent:",
        title
      );


    } catch (error) {

      console.error(
        "❌ Notification failed:",
        error
      );

    }

  }


  /* ========================= */
  /* DASHBOARD READY */
  /* ========================= */

  let dashboardReady = false;


  /* ========================= */
  /* FORMAT TIME */
  /* ========================= */

  function formatTime(timestamp) {

    if (!timestamp) {

      return "Masa tidak tersedia";

    }


    const date =
      new Date(timestamp);


    return date.toLocaleString(
      "ms-MY",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

  }


  /* ========================= */
  /* FOOD */
  /* ========================= */

  const foodRef =
    ref(db, "foodChoices");


  onValue(
    foodRef,
    snapshot => {

      const list =
        document.getElementById(
          "foodList"
        );


      list.innerHTML = "";


      if (!snapshot.exists()) {

        list.innerHTML =
          `<div class="empty">
            Belum ada pilihan makanan.
          </div>`;

        return;
      }


      const data =
        snapshot.val();


      Object.entries(data)
        .reverse()
        .forEach(
          ([id, item]) => {

            const card =
              document.createElement(
                "div"
              );

            card.className =
              "card";


            card.innerHTML = `

              <div class="card-title">
                🍔 ${item.food || "Makanan"}
              </div>

              <div class="time">
                ${formatTime(item.timestamp)}
              </div>

            `;


            list.appendChild(card);

          }
        );

    }
  );


  /* ========================= */
  /* NEW FOOD NOTIFICATION */
  /* ========================= */

  onChildAdded(
    foodRef,
    snapshot => {

      if (!dashboardReady) {
        return;
      }


      const data =
        snapshot.val();


      showDashboardNotification(
        "🍔 Sayang Space",
        `Dia pilih ${data.food || "makanan"} ❤️`
      );

    }
  );


  /* ========================= */
  /* EMOTION */
  /* ========================= */

  const emotionRef =
    ref(db, "emotions");


  onValue(
    emotionRef,
    snapshot => {

      const list =
        document.getElementById(
          "emotionList"
        );


      list.innerHTML = "";


      if (!snapshot.exists()) {

        list.innerHTML =
          `<div class="empty">
            Belum ada emotion.
          </div>`;

        return;
      }


      const data =
        snapshot.val();


      Object.entries(data)
        .reverse()
        .forEach(
          ([id, item]) => {

            const card =
              document.createElement(
                "div"
              );


            card.className =
              "card";


            card.innerHTML = `

              <div class="card-title">
                💭 ${item.emotionName || "Emotion"}
              </div>

              <div class="time">
                ${formatTime(item.timestamp)}
              </div>

            `;


            list.appendChild(card);

          }
        );

    }
  );


  /* ========================= */
  /* NEW EMOTION NOTIFICATION */
  /* ========================= */

  onChildAdded(
    emotionRef,
    snapshot => {

      if (!dashboardReady) {
        return;
      }


      const data =
        snapshot.val();


      showDashboardNotification(
        "💭 Emotion",
        `Dia rasa ${data.emotionName || "sesuatu"} 🤍`
      );

    }
  );


  /* ========================= */
  /* FEELINGS */
  /* ========================= */

  const feelingRef =
    ref(db, "feelings");


  onValue(
    feelingRef,
    snapshot => {

      const list =
        document.getElementById(
          "feelingList"
        );


      list.innerHTML = "";


      if (!snapshot.exists()) {

        list.innerHTML =
          `<div class="empty">
            Belum ada luahan.
          </div>`;

        return;
      }


      const data =
        snapshot.val();


      Object.entries(data)
        .reverse()
        .forEach(
          ([id, item]) => {

            const card =
              document.createElement(
                "div"
              );


            card.className =
              "card";


            card.innerHTML = `

              <div class="card-title">
                💌 ${item.emotionName || "Luahan"}
              </div>

              <div class="message">
                ${item.message || ""}
              </div>

              <div class="time">
                ${formatTime(item.timestamp)}
              </div>

            `;


            list.appendChild(card);

          }
        );

    }
  );


  /* ========================= */
  /* NEW FEELING NOTIFICATION */
  /* ========================= */

  onChildAdded(
    feelingRef,
    snapshot => {

      if (!dashboardReady) {
        return;
      }


      const data =
        snapshot.val();


      showDashboardNotification(
        "💌 Ada luahan baru",
        data.message ||
        "Dia baru meluah sesuatu 🤍"
      );

    }
  );


  /* ========================= */
  /* WAIT FOR INITIAL DATA */
  /* ========================= */

  setTimeout(
    () => {

      dashboardReady = true;

      console.log(
        "✅ Dashboard notification ready"
      );

    },
    2000
  );


</script>

</body>
</html>
