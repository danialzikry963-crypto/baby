<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Danial Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5f8;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .item {
      padding: 14px;
      border-radius: 14px;
      background: #fafafa;
      margin-top: 10px;
    }

    .time {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }

    .empty {
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💗 Danial Dashboard</h1>

    <div class="subtitle">
      Sayang Space
    </div>

    <!-- FOOD -->
    <div class="card">
      <h2>🍔 Makanan</h2>

      <div id="foodList">
        <div class="empty">
          Belum ada pilihan makanan.
        </div>
      </div>
    </div>

    <!-- EMOTION -->
    <div class="card">
      <h2>💭 Emotion</h2>

      <div id="emotionList">
        <div class="empty">
          Belum ada emotion.
        </div>
      </div>
    </div>

    <!-- FEELINGS -->
    <div class="card">
      <h2>💌 Luahan</h2>

      <div id="feelingList">
        <div class="empty">
          Belum ada luahan.
        </div>
      </div>
    </div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      onChildAdded
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // FIREBASE CONFIG
    const firebaseConfig = {

      apiKey:
        "AIzaSyDSFvZ3JtqTB7HP85WyRa5dka9VRUJdKDU",

      authDomain:
        "baby-7eec4.firebaseapp.com",

      databaseURL:
        "https://baby-7eec4-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "baby-7eec4",

      storageBucket:
        "baby-7eec4.firebasestorage.app",

      messagingSenderId:
        "824621868036",

      appId:
        "1:824621868036:web:870a7c66e9311fb77ec151"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);
    // =========================
// NOTIFICATION
// =========================

let dashboardReady = false;

async function enableNotifications() {
  if (!("Notification" in window)) {
    alert("Browser ni tak support notification.");
    return;
  }

  if (Notification.permission === "default") {
    await Notification.requestPermission();
  }
}

function showNotification(title, body) {
  if (Notification.permission === "granted") {
    new Notification(title, {
      body: body
    });
  }
}

enableNotifications();


    // =========================
    // FOOD
    // =========================

    const foodRef = ref(db, "foodChoices");

    onValueonChildAdded(foodRef, (snapshot) => {

  if (!dashboardReady) return;

  const data = snapshot.val();

  showNotification(
    "🍔 Sayang Space",
    `Dia pilih ${data.food || "makanan"} ❤️`
  );

});(foodRef, (snapshot) => {

      const data = snapshot.val();

      const list = document.getElementById("foodList");

      list.innerHTML = "";

      if (!data) {

        list.innerHTML =
          '<div class="empty">Belum ada pilihan makanan.</div>';

        return;
      }

      Object.values(data)
        .reverse()
        .forEach(item => {

          const div = document.createElement("div");

          div.className = "item";

          div.innerHTML = `
            <strong>${item.food || "Unknown"}</strong>
            <div class="time">
              ${formatTime(item.timestamp)}
            </div>
          `;

          list.appendChild(div);

        });

    });


    // =========================
    // EMOTION
    // =========================

    const emotionRef = ref(db, "emotions");

    onValue(emotionRef, (snapshot) => {

      const data = snapshot.val();

      const list =
        document.getElementById("emotionList");

      list.innerHTML = "";

      if (!data) {

        list.innerHTML =
          '<div class="empty">Belum ada emotion.</div>';

        return;
      }

      Object.values(data)
        .reverse()
        .forEach(item => {

          const div = document.createElement("div");

          div.className = "item";

          div.innerHTML = `
            <strong>
              ${item.emotionName || item.emotion || "Unknown"}
            </strong>

            <div class="time">
              ${formatTime(item.timestamp)}
            </div>
          `;

          list.appendChild(div);

        });

    });


    // =========================
    // FEELINGS
    // =========================

    const feelingsRef = ref(db, "feelings");

    onValue(feelingsRef, (snapshot) => {

      const data = snapshot.val();

      const list =
        document.getElementById("feelingList");

      list.innerHTML = "";

      if (!data) {

        list.innerHTML =
          '<div class="empty">Belum ada luahan.</div>';

        return;
      }

      Object.values(data)
        .reverse()
        .forEach(item => {

          const div = document.createElement("div");

          div.className = "item";

          div.innerHTML = `

            <strong>
              ${item.emotionName || "Luahan"}
            </strong>

            <p>
              ${item.message || ""}
            </p>

            <div class="time">
              ${formatTime(item.timestamp)}
            </div>

          `;

          list.appendChild(div);

        });

    });


    // =========================
    // TIME
    // =========================

    function formatTime(timestamp) {

      if (!timestamp) {
        return "Masa tidak tersedia";
      }

      const date = new Date(timestamp);

      return date.toLocaleString("ms-MY", {
        dateStyle: "medium",
        timeStyle: "short"
      });

    }
    // =========================
// DASHBOARD READY
// =========================

setTimeout(() => {
  dashboardReady = true;
  console.log("✅ Dashboard notification ready");
}, 2000);

  </script>

</body>
</html>
